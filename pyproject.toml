[project]
name = "flinch-agent"
version = "0.5.0"
description = "Pain receptors for AI agents: when an action causes damage, the agent never does it again."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Ganesh", email = "voxmastery@gmail.com" }]
keywords = ["ai-agents", "claude-code", "cursor", "safety", "hooks", "guardrails"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: POSIX",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development",
]
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "numpy>=1.26",
  "typer>=0.12",
  "httpx>=0.27",
  "fastembed>=0.3",
  "fluctlightdb[native]>=0.5.21",
]

[project.urls]
Homepage = "https://flinch-site-khaki.vercel.app"
Source = "https://github.com/voxmastery/flinch"

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
flinch = "flinch.cli:app"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["flinch*"]

[tool.setuptools.package-data]
flinch = ["ui/dist/*", "ui/dist/**/*", "innate.npz"]

[tool.pytest.ini_options]
testpaths = ["tests"]
